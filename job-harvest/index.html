<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>高校宣讲会/双选会查询 · 静态原型</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--blue:#2f5597;--blue2:#e8f0fe}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif}
header{background:linear-gradient(135deg,#1e3a8a,#2f5597);color:#fff;padding:22px 32px}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;opacity:.85;font-size:13px}
.wrap{max-width:1320px;margin:20px auto;padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:24px;color:var(--blue)}
.stat span{color:var(--muted);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
input[type=text]{width:240px}
button{padding:8px 14px;border:0;border-radius:8px;background:var(--blue);color:#fff;cursor:pointer}
button.ghost{background:#eef2ff;color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;background:#fafafa;position:sticky;top:0}
td:first-child,th:first-child{white-space:nowrap}
tr:hover td{background:#f8faff}
a{color:var(--blue);text-decoration:none}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--blue2);color:var(--blue);font-size:12px;white-space:nowrap}
.tag.fair{background:#fff2e8;color:#c2410c}
.tag.jobfair{background:#ecfdf5;color:#047857}
.empty{color:var(--muted);padding:30px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{padding:7px 14px;border-radius:8px;background:#eef2ff;color:var(--blue);cursor:pointer;font-size:13px}
.tab.active{background:var(--blue);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card-title{font-size:14px;font-weight:700;margin:0 0 10px}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bar-label{width:180px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{color:var(--muted);font-size:12px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:26px}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>高校宣讲会 / 双选会查询</h1>
  <p>静态原型 · 数据来自本地 events 表 · <span id="hdr-count"></span></p>
</header>
<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="s-events">0</b><span>活动总数</span></div>
    <div class="stat"><b id="s-companies">0</b><span>企业</span></div>
    <div class="stat"><b id="s-schools">0</b><span>高校</span></div>
    <div class="stat"><b id="s-fairs">0</b><span>双选会 / 招聘会</span></div>
  </div>

  <div class="panel">
    <div class="tabs">
      <div class="tab active" data-tab="list">活动列表</div>
      <div class="tab" data-tab="company">企业足迹</div>
      <div class="tab" data-tab="school">学校概览</div>
      <div class="tab" data-tab="catalog">高校目录</div>
      <div class="tab" data-tab="compare">企业对比</div>
    </div>

    <div id="tab-list">
      <div class="controls">
        <input type="text" id="q" placeholder="搜索企业 / 活动 / 学校">
        <select id="type"><option value="">全部类型</option><option>宣讲会</option><option>双选会</option><option>招聘会</option></select>
        <select id="school"><option value="">全部学校</option></select>
        <input type="date" id="from"><span class="count">至</span><input type="date" id="to">
        <button class="ghost" id="reset">重置</button>
        <button id="export">导出 CSV</button>
        <span class="count" id="count"></span>
      </div>
      <div style="overflow:auto;max-height:600px;margin-top:12px">
        <table>
          <thead><tr><th>日期</th><th>类型</th><th>企业</th><th>活动</th><th>学校</th><th>地点</th><th>链接</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-company" style="display:none">
      <div class="controls"><input id="company" list="company-list" placeholder="搜索企业（输入关键词）" autocomplete="off"><datalist id="company-list"></datalist><span class="count" id="company-count"></span></div>
      <div class="grid2" style="margin-top:12px">
        <div><p class="card-title">覆盖学校</p><div id="company-schools"></div></div>
        <div><p class="card-title">场次明细</p><div id="company-events" style="max-height:440px;overflow:auto"></div></div>
      </div>
    </div>

    <div id="tab-compare" style="display:none">
      <div class="controls">
        <input id="cmp-a" list="cmp-list" placeholder="搜索企业 A" autocomplete="off">
        <input id="cmp-b" list="cmp-list" placeholder="搜索企业 B" autocomplete="off"><datalist id="cmp-list"></datalist>
        <button id="cmp-go">对比</button>
        <span class="count" id="cmp-count"></span>
      </div>
      <div class="grid2" style="margin-top:12px">
        <div><p class="card-title">共同覆盖学校</p><div id="cmp-common"></div></div>
        <div><p class="card-title">差异学校</p><div id="cmp-diff"></div></div>
      </div>
    </div>

    <div id="tab-catalog" style="display:none">
      <div class="controls"><input type="text" id="catalog-q" placeholder="搜索学校"><span class="count" id="catalog-count"></span></div>
      <div style="overflow:auto;max-height:600px;margin-top:12px">
        <table><thead><tr><th>学校</th><th>活动数</th><th>企业数</th><th>双选/招聘会</th><th>最近日期</th><th>查看</th></tr></thead>
        <tbody id="catalog-rows"></tbody></table>
      </div>
    </div>

    <div id="tab-school" style="display:none">
      <div class="controls"><select id="school2"><option value="">选择学校</option></select><span class="count" id="school-count"></span></div>
      <div id="school-summary" class="stats" style="grid-template-columns:repeat(4,1fr);margin:12px 0"></div>
      <div class="grid2">
        <div><p class="card-title">来访企业</p><div id="school-companies" style="max-height:360px;overflow:auto"></div></div>
        <div><p class="card-title">最近宣讲会</p><div id="school-lectures" style="max-height:360px;overflow:auto"></div>
            <p class="card-title" style="margin-top:14px">最近双选会 / 招聘会</p><div id="school-fairs" style="max-height:260px;overflow:auto"></div></div>
      </div>
    </div>
  </div>
  <footer>数据来自本地 jobs.db，按“公司+标题+日期+学校”去重；仅展示已有记录，不代表全量覆盖</footer>
</div>

const $ = s => document.querySelector(s);
const esc = s => String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uniq = a => [...new Set(a)].filter(Boolean).sort((x,y)=>x.localeCompare(y,"zh"));
function tag(t){return `<span class="tag ${t==="双选会"?"fair":t==="招聘会"?"jobfair":""}">${esc(t)}</span>`}
function init(){
  const ds=DATA.map(x=>x.date).filter(Boolean).sort();
  $("#s-events").textContent=DATA.length;
  $("#s-companies").textContent=uniq(DATA.map(x=>x.company)).length;
  $("#s-schools").textContent=uniq(DATA.map(x=>x.school)).length;
  $("#s-fairs").textContent=DATA.filter(x=>x.type!=="宣讲会").length;
  $("#hdr-count").textContent=`共 ${DATA.length} 条，${uniq(DATA.map(x=>x.school)).length} 所高校，日期 ${ds[0]} ~ ${ds[ds.length-1]}`;
  const schools=uniq(DATA.map(x=>x.school));
  $("#school").innerHTML+=schools.map(s=>`<option>${esc(s)}</option>`).join("");
  $("#school2").innerHTML+=schools.map(s=>`<option>${esc(s)}</option>`).join("");
  $("#company-list").innerHTML+=uniq(DATA.map(x=>x.company)).map(s=>`<option value="${esc(s)}">`).join("");
  const comps=uniq(DATA.map(x=>x.company));
  $("#cmp-list").innerHTML+=comps.map(s=>`<option value="${esc(s)}">`).join("");
  render();renderCatalog();
}
function filtered(){
  const q=$("#q").value.trim().toLowerCase(), type=$("#type").value, school=$("#school").value, from=$("#from").value, to=$("#to").value;
  return DATA.filter(x=>{
    if(type && x.type!==type) return false;
    if(school && x.school!==school) return false;
    if(from && x.date && x.date<from) return false;
    if(to && x.date && x.date>to) return false;
    if(q && !(x.company+x.title+x.school).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}
function render(){
  const rows=filtered(); $("#count").textContent=`共 ${rows.length} 条`;
  $("#rows").innerHTML=rows.length?rows.map(x=>`<tr>
    <td>${esc(x.date)} ${x.verified?'<span class="tag">已核验</span>':''}</td><td>${tag(x.type)}</td>
    <td><a href="#" onclick="showCompany('${esc(x.company).replace(/'/g,"\\'")}');return false">${esc(x.company)}</a></td>
    <td>${esc(x.title)}</td><td><a href="#" onclick="showSchool('${esc(x.school).replace(/'/g,"\\'")}');return false">${esc(x.school)}</a></td><td>${esc(x.location)}</td>
    <td><a href="${esc(x.url)}" target="_blank" rel="noopener">原页</a></td></tr>`).join(""):`<tr><td colspan="7" class="empty">没有匹配的记录</td></tr>`;
}
function showCompany(name){switchTab("company");$("#company").value=name;renderCompany();}
function switchTab(t){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===t));["list","company","school","catalog","compare"].forEach(k=>$("#tab-"+k).style.display=k===t?"":"none");}
function resolveCompany(el){
  const v=el.value.trim(); if(!v) return "";
  const cs=uniq(DATA.map(x=>x.company));
  if(cs.includes(v)) return v;
  const hit=cs.find(c=>c.includes(v));
  if(hit){el.value=hit;return hit;}
  return "";
}
function renderCompany(){
  const name=resolveCompany($("#company"));
  if(!name){$("#company-count").textContent="未找到企业";$("#company-schools").innerHTML='<div class="empty">换个关键词试试</div>';$("#company-events").innerHTML="";return;}
  const rows=DATA.filter(x=>x.company===name).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const schools=uniq(rows.map(x=>x.school));
  $("#company-count").textContent=`${rows.length} 场 / ${schools.length} 校`;
  $("#company-schools").innerHTML=schools.length?schools.map(s=>`<div class="bar-row"><span class="bar-label">${esc(s)}</span><span>${rows.filter(x=>x.school===s).length} 场</span></div>`).join(""):'<div class="empty">请选择企业</div>';
  $("#company-events").innerHTML=rows.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${esc(x.date)}</b> ${tag(x.type)} · ${esc(x.school)}<br><span class="count">${esc(x.title)}</span><br><span class="count">${esc(x.location)}</span></div>`).join("");
}
function renderCompare(){
  const a=resolveCompany($("#cmp-a")),b=resolveCompany($("#cmp-b"));
  if(!a||!b){$("#cmp-count").textContent="请选择两家企业";return;}
  const A=DATA.filter(x=>x.company===a),B=DATA.filter(x=>x.company===b);
  const sa=uniq(A.map(x=>x.school)),sb=uniq(B.map(x=>x.school));
  const common=sa.filter(x=>sb.includes(x)),onlyA=sa.filter(x=>!sb.includes(x)),onlyB=sb.filter(x=>!sa.includes(x));
  $("#cmp-count").textContent=`${a} ${A.length} 场/${sa.length} 校 · ${b} ${B.length} 场/${sb.length} 校`;
  $("#cmp-common").innerHTML=common.length?common.map(s=>`<div class="bar-row"><span class="bar-label">${esc(s)}</span><span>A ${A.filter(x=>x.school===s).length} / B ${B.filter(x=>x.school===s).length}</span></div>`).join(""):'<div class="empty">没有共同学校</div>';
  $("#cmp-diff").innerHTML=`<div class="card-title">仅 ${esc(a)}</div>`+(onlyA.length?onlyA.map(s=>`<div class="bar-row"><span class="bar-label">${esc(s)}</span></div>`).join(""):'<div class="count">无</div>')+`<div class="card-title" style="margin-top:12px">仅 ${esc(b)}</div>`+(onlyB.length?onlyB.map(s=>`<div class="bar-row"><span class="bar-label">${esc(s)}</span></div>`).join(""):'<div class="count">无</div>');
}
function renderCatalog(){
  const q=$("#catalog-q").value.trim().toLowerCase();
  const schools=uniq(DATA.map(x=>x.school)).filter(s=>!q||s.toLowerCase().includes(q));
  const rows=schools.map(s=>{
    const rs=DATA.filter(x=>x.school===s);
    return {s,n:rs.length,c:uniq(rs.map(x=>x.company)).length,f:rs.filter(x=>x.type!=="宣讲会").length,d:rs.map(x=>x.date).sort().pop()||""};
  }).sort((a,b)=>b.n-a.n);
  $("#catalog-count").textContent=`${rows.length} 所`;
  $("#catalog-rows").innerHTML=rows.map(r=>`<tr><td>${esc(r.s)}</td><td>${r.n}</td><td>${r.c}</td><td>${r.f}</td><td>${esc(r.d)}</td><td><a href="#" onclick="showSchool('${esc(r.s).replace(/'/g,"\\'")}');return false">查看</a></td></tr>`).join("");
}
function showSchool(name){switchTab("school");$("#school2").value=name;renderSchool();}
function renderSchool(){
  const name=$("#school2").value, rows=DATA.filter(x=>x.school===name).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const comps=uniq(rows.map(x=>x.company));
  $("#school-count").textContent=`${rows.length} 场 / ${comps.length} 家`;
  const dates=rows.map(x=>x.date).filter(Boolean).sort();
  $("#school-summary").innerHTML=`<div class="stat"><b>${rows.length}</b><span>活动</span></div><div class="stat"><b>${comps.length}</b><span>企业</span></div><div class="stat"><b>${rows.filter(x=>x.type!=="宣讲会").length}</b><span>双选/招聘会</span></div><div class="stat"><b style="font-size:15px;line-height:1.5">${dates[0]||"-"}<br>~ ${dates[dates.length-1]||"-"}</b><span>日期范围</span></div>`;
  $("#school-companies").innerHTML=comps.length?comps.slice(0,50).map(c=>`<div class="bar-row"><span class="bar-label">${esc(c)}</span><span>${rows.filter(x=>x.company===c).length} 场</span></div>`).join(""):'<div class="empty">请选择学校</div>';
  const lect=rows.filter(x=>x.type==="宣讲会");
  $("#school-lectures").innerHTML=lect.slice(0,40).map(x=>`<div style="padding:7px 0;border-bottom:1px solid #eee"><b>${esc(x.date)}</b> · ${esc(x.company)}<br><span class="count">${esc(x.title)}<br>${esc(x.location)}</span></div>`).join("")||'<div class="empty">暂无宣讲会</div>';
  const fairs=rows.filter(x=>x.type!=="宣讲会");
  $("#school-fairs").innerHTML=fairs.slice(0,20).map(x=>`<div style="padding:7px 0;border-bottom:1px solid #eee"><b>${esc(x.date)}</b> ${tag(x.type)}<br><span class="count">${esc(x.title)}</span></div>`).join("")||'<div class="empty">暂无</div>';
}
async function boot(){
  if(location.hostname==="127.0.0.1"||location.hostname==="localhost"){
    try{
      const r=await fetch("api/events",{cache:"no-store"});
      if(r.ok){const j=await r.json(); if(Array.isArray(j.events)&&j.events.length){DATA=j.events;}}
    }catch(e){}
  }
  init();
  $("#q").addEventListener("input",render);$("#type").addEventListener("change",render);
  $("#school").addEventListener("change",render);$("#from").addEventListener("change",render);$("#to").addEventListener("change",render);
  $("#reset").addEventListener("click",()=>{$("#q").value="";$("#type").value="";$("#school").value="";$("#from").value="";$("#to").value="";render();});
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchTab(t.dataset.tab)));
  $("#company").addEventListener("change",renderCompany);$("#school2").addEventListener("change",renderSchool);
  $("#catalog-q").addEventListener("input",renderCatalog);$("#cmp-go").addEventListener("click",renderCompare);
  $("#export").addEventListener("click",()=>{
    const rows=filtered(); const head=["日期","类型","企业","活动","学校","地点","链接"];
    const body=rows.map(x=>[x.date,x.type,x.company,x.title,x.school,x.location,x.url]);
    const csv=[head,...body].map(r=>r.map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(",")).join("\n");
    const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="宣讲双选筛选结果.csv"; a.click();
  });
}
boot();
</script>
</body>
</html>
